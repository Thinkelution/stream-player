name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            command: npm run build-mac
            artifacts: |
              dist/OpenStreamPlayer-*-arm64.dmg
              dist/OpenStreamPlayer-*-arm64-mac.zip
          - name: Windows
            os: windows-latest
            command: npm run build-win
            artifacts: |
              dist/*.exe
          - name: Linux
            os: ubuntu-latest
            command: npm run build-linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build artifacts
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstreamplayer-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
